# RadaR — composicao do agente.
#
# Copiado do exemplo publicado pela Plow (plow-agents/compose.example.yml), no
# clone de leitura.
#
# O comentario anterior dizia aqui que "o exemplo da Plow nao pede identificador
# de agente, e esta casa nao inventa um". Era verdade sobre o compose.example.yml
# e FALSA como conclusao: o `AGENT_ID` esta no README da Plow, e sem ele o
# reporter do Agent Index sobe, avisa que nao tem para quem reportar, e dorme
# 86400. O agente funciona igual e o placar nao enxerga nada.
services:
  agent:
    build: .
    # O `AGENT_ID` NÃO MORA MAIS AQUI: mora no `Dockerfile`, assado na imagem.
    # Um deploy de nuvem não roda este arquivo — sobe a imagem sozinha, com o
    # ambiente do provisionador —, e um `AGENT_ID` que só existisse aqui não
    # chegaria lá. O agente funcionaria e o placar não veria nada.
    #
    # A CREDENCIAL ENTRA PELO AMBIENTE, não mais por monte. A base parou de
    # promover `/var/lib/plow/credentials.host` no commit b78250e: quem
    # continuar montando fica sem credencial nenhuma e o `plow-init` estaciona.
    # Esta é a forma do `compose.example.yml` publicado pela Plow.
    #
    # Esta continua sendo a ÚNICA credencial que o contêiner vê. A credencial
    # da CONTA vive fora desta pasta e nunca entra aqui.
    env_file:
      - path: ./plow-credentials
        required: false
    volumes:
      # A casa do agente, preservada entre `up` e `down` — sessões e configuração.
      #
      # Uma edição na persona NÃO precisa de `down -v`: o `plow-init` compõe a
      # identidade dentro da casa a cada boot, então `up --build -d` basta.
      #
      # `docker compose down -v` APAGA este volume. Depois do registro no Índice
      # isso é irreversível no que importa: o id da instalação vai junto, e a
      # identidade no placar troca. Usar só para descartar o agente de propósito.
      #
      # Corrigido em 11/09/2026. O comentário anterior mandava rodar `down -v`
      # para ver mudança de persona — era a premissa derrubada de 09/09 virada
      # em comando, e o comando é justamente o que queima a identidade.
      # Fonte: `plow-hermes-agent/compose.yml` no clone de leitura, que diz na
      # letra "An edit to SOUL.md does not need it".
      - agent-home:/var/lib/hermes
    # O agente salva estado no SIGTERM; o supervisor dele dá 30s, e o padrão de
    # 10s do Docker corta no meio e órfã a transcrição.
    stop_grace_period: 35s
    # Sem portas: o agente conecta para fora, na direção da Plow.

volumes:
  agent-home:
